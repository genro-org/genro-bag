[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-bag"
version = "0.28.0"
description = "Modernized bag system for the Genropy framework - hierarchical data container with XML serialization"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Genropy Team"}
]
keywords = [
    "bag",
    "hierarchical-data",
    "xml-serialization",
    "data-container",
    "genro",
    "genropy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "genro-toolbox>=0.18.0",
    "genro-tytx>=0.16.2",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "msgpack>=1.0",
    "orjson>=3.9",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
    "myst-parser>=4.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
]
contrib-resolvers = []
contrib-resolvers-system = [
    "genro-bag[contrib-resolvers]",
    "psutil",
]
xsd-validate = [
    "xmlschema>=3.0",
]
all = [
    "genro-bag[dev,docs,xsd-validate,contrib-resolvers]",
]

[project.urls]
Homepage = "https://github.com/genropy/genro-bag"
Documentation = "https://genro-bag.readthedocs.io"
Repository = "https://github.com/genropy/genro-bag"
Issues = "https://github.com/genropy/genro-bag/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/genro_bag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=genro_bag --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long
    "B008",   # no function calls in arg defaults
]

[tool.ruff.lint.isort]
known-first-party = ["genro_bag"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
files = ["src/genro_bag"]

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/genro_bag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "\\.\\.\\.",
]
